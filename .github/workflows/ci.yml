name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # No PostgreSQL service: the contract suite starts its own postgres:17
    # per twin through Testcontainers, and the Ubuntu runner ships Docker.

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The money shot: the shared Alba contract suite, green on BOTH hosts.
      - name: Test
        run: dotnet test --no-build --configuration Release
