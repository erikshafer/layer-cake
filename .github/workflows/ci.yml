name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The same PostgreSQL 17 the local docker-compose provides; both twins
    # (schemas "before" and "after") share the one "layercake" database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: layercake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d layercake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The money shot: the shared Alba contract suite, green on BOTH hosts.
      - name: Test
        run: dotnet test --no-build --configuration Release
