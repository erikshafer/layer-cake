services:
  postgres:
    image: postgres:17
    container_name: layercake-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: layercake
    ports:
      - "5432:5432"
    volumes:
      - layercake-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d layercake"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  layercake-pgdata:
